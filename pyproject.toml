[project]
name = "fyfit-backend"
version = "0.1.0"
description = "FYFIT wearable ecosystem backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "celery[redis]>=5.4.0",
    "email-validator>=2.2.0",
    "firebase-admin>=6.5.0",
    "fastapi>=0.111.0",
    "greenlet>=3.0.3",
    "httpx>=0.27.0",
    "langchain>=0.2.10",
    "openai>=1.40.0",
    "psycopg[binary]>=3.2.1",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.8",
    "sqlalchemy>=2.0.32",
    "uvicorn[standard]>=0.30.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.5.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
